name: Render PlantUML diagram

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: Repository-relative path, e.g. Week 4/week4-class-diagram.puml
        required: true
        type: string
      formats:
        description: Comma-separated PlantUML formats (e.g. png,svg,pdf). See https://plantuml.com/command-line for supported formats.
        required: true
        default: png
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
          FORMATS: ${{ inputs.formats }}
        run: |
          set -euo pipefail

          source_file=$(printf '%s' "$SOURCE_FILE" | sed 's#^\./##')
          echo "Using PlantUML source file: $source_file"

          case "$source_file" in
            *.puml) ;;
            *)
              echo "::error::source_file must point to a .puml file."
              exit 1
              ;;
          esac

          case "$source_file" in
            /*|*..*)
              echo "::error::source_file must be a repository-relative path without '..'."
              exit 1
              ;;
          esac

          if [ ! -f "$source_file" ]; then
            echo "::error::PlantUML file not found: $source_file"
            echo "::error::Use a path such as 'Week 4/week4-class-diagram.puml'."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/plantuml-output"
          printf '%s' "$FORMATS" | tr ',' '\n' | sed 's/[[:space:]]//g' > "$RUNNER_TEMP/plantuml-formats"

          if [ ! -s "$RUNNER_TEMP/plantuml-formats" ]; then
            echo "::error::At least one output format is required."
            exit 1
          fi

          while IFS= read -r format; do
            case "$format" in
              png|svg|eps|eps:text|pdf|vdx|xmi|scxml|html|txt|utxt|latex|latex:nopreamble|braille) ;;
              *)
                echo "::error::Unsupported PlantUML format: $format"
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/plantuml-formats"

      - name: Render diagrams
        shell: bash
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
        run: |
          set -euo pipefail

          source_file=$(printf '%s' "$SOURCE_FILE" | sed 's#^\./##')
          echo "Rendering PlantUML source file: $source_file"

          while IFS= read -r format; do
            echo "Rendering format: $format"
            docker run --rm --network none \
              --user "$(id -u):$(id -g)" \
              --volume "$GITHUB_WORKSPACE:/workspace:ro" \
              --volume "$RUNNER_TEMP/plantuml-output:/output" \
              plantuml/plantuml:latest \
              "-t$format" \
              -o /output \
              "/workspace/$source_file"
          done < "$RUNNER_TEMP/plantuml-formats"

      - name: Upload generated diagrams
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-diagrams
          path: ${{ runner.temp }}/plantuml-output
          if-no-files-found: error
